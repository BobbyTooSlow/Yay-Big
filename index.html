<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yay Big</title>
<style>
*{box-sizing:border-box}
:root{--bg:#000;--panel:#0a0f14;--panel2:#111920;--text:#fff;--blue:#7dd3fc;--muted:#9eabb7;--border:#22303b;--danger:#ff9a9a}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
body{min-height:100dvh}
.app{width:min(780px,calc(100% - 18px));height:100dvh;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:16px}
.kick{margin:0;font-size:1.05rem}
.brand{margin:3px 0 0;color:var(--blue);font-size:3.4rem;line-height:.88;letter-spacing:-.055em}
.progress{color:var(--blue);font-weight:900;font-size:1.1rem;padding-top:5px}
.card{border:1px solid var(--border);border-radius:20px;background:var(--panel);min-height:0;overflow:hidden}
.game-card{height:100%;padding:clamp(18px,2.5vh,28px);display:grid;grid-template-rows:auto minmax(0,1fr)}
.question-wrap{padding-bottom:14px}
.eyebrow{margin:0 0 10px;color:var(--blue);font-size:.8rem;font-weight:900;letter-spacing:.16em}
h2{margin:0;font-size:clamp(1.8rem,4.8vw,2.6rem);line-height:1.12}
.play-stage{min-height:0}
#entry{height:100%;min-height:0;display:grid;grid-template-rows:auto 18px minmax(0,1fr);gap:10px}
.control-zone{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(180px,.85fr);gap:18px;align-items:stretch}
.guess-side{display:grid;grid-template-rows:1fr auto;gap:12px}
.guess-field{min-height:82px;border:1px solid var(--border);border-radius:14px;background:#030506;padding:0 18px;display:flex;align-items:center;font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800;letter-spacing:.01em;overflow:hidden}
.guess-value{white-space:nowrap;min-width:0}
.guess-placeholder{color:#667480;font-weight:700;font-size:clamp(1.25rem,4.6vw,1.8rem)}
.caret{display:inline-block;width:2px;height:1.15em;margin-left:3px;background:var(--blue);vertical-align:-.12em;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.btn{height:58px;padding:0 18px;border:1px solid var(--blue);border-radius:13px;background:var(--blue);color:#001018;font:inherit;font-size:1.05rem;font-weight:900;cursor:pointer}
.unit-side{display:grid;grid-template-rows:auto 1fr;gap:7px}
.unit-title{color:var(--muted);font-size:.82rem;font-weight:800}
.unit-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:8px;min-height:0}
.unit-grid{position:relative}
.unit-grid::after{content:"";position:absolute;top:5px;bottom:5px;left:50%;width:1px;background:var(--border);transform:translateX(-.5px);pointer-events:none}

.unit-btn{min-height:48px;border:1px solid var(--border);border-radius:12px;background:#eef0f2;color:#111;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;touch-action:manipulation}
.unit-btn.selected{border-color:var(--blue);background:var(--blue);color:#001018}
.validation{min-height:18px;margin:0;color:var(--danger);font-size:.84rem}
.keypad{min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.key{min-height:54px;border:1px solid var(--border);border-radius:15px;background:var(--panel2);color:#fff;font:inherit;font-size:1.65rem;font-weight:850;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key:active{background:#1b2a34}
.key.utility{color:var(--blue);font-size:1.1rem}
.result{height:100%;display:flex;flex-direction:column;justify-content:center;padding:8px 2px 0;border-top:1px solid var(--border)}
.result-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(112px,28%);gap:10px;align-items:center}
.answer-stack{display:grid;gap:16px}
.lab{display:block;color:var(--muted);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.answer-cell strong{display:block;font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.2}
.score-side{text-align:center;border-left:1px solid #17212a;padding:0 10px 0 12px;min-width:0;overflow:hidden}
.score-percent{color:var(--blue);font-size:clamp(2.8rem,9vw,4.6rem);line-height:.9;font-weight:950;white-space:nowrap}
.score-mult{margin-top:10px;color:var(--muted);font-size:1.05rem;font-weight:900}
.verdict{margin:18px 0 0;color:var(--muted);font-size:1rem}
.next{margin-top:18px;align-self:stretch}
#summary{height:100%;padding:28px;display:flex;flex-direction:column;justify-content:center}
.summary-line{font-size:1.35rem}.score{color:var(--blue)}.hidden{display:none!important}
@media(max-width:430px){
 .app{width:calc(100% - 12px)} .top{margin-bottom:12px} .brand{font-size:2.85rem} .game-card{padding:15px} h2{font-size:1.6rem}
 .question-wrap{padding-bottom:12px} .control-zone{grid-template-columns:minmax(0,1.2fr) minmax(150px,.8fr);gap:12px}
 .guess-field{min-height:74px;padding:0 14px} .btn{height:54px} .unit-btn{min-height:44px;font-size:.98rem} .unit-grid{gap:6px} .keypad{gap:7px}
 .key{font-size:1.45rem} .result-layout{grid-template-columns:minmax(0,1fr) 110px;gap:12px}
}
@media(max-height:720px){
 .app{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)} .top{margin-bottom:6px} .brand{font-size:2.25rem} .kick{font-size:.8rem}
 .game-card{padding:11px} .question-wrap{padding-bottom:8px} .eyebrow{margin-bottom:5px} h2{font-size:1.35rem}
 .guess-field{min-height:58px} .btn{height:46px} .unit-btn{min-height:36px} #entry{grid-template-rows:auto 14px minmax(0,1fr);gap:6px} .keypad{gap:6px} .key{min-height:38px}
}
</style>
</head>

<main class="app">
<header class="top"><div><p class="kick">I'd say it's about...</p><h1 class="brand">Yay Big</h1></div><div id="progress" class="progress"></div></header>
<section id="game" class="card game-card">
  <div class="question-wrap"><p id="diff" class="eyebrow"></p><h2 id="question"></h2></div>
  <div class="play-stage">
    <div id="entry">
      <div class="control-zone">
        <div class="guess-side">

          <button id="submit" class="btn" type="button">Submit</button>
        </div>
        <div class="unit-side">
          <div id="unitGrid" class="unit-grid" role="group" aria-label="Choose unit">

            <button class="unit-btn" type="button" data-unit="ft">FT</button><button class="unit-btn" type="button" data-unit="cm">CM</button>
            <button class="unit-btn" type="button" data-unit="yd">YD</button><button class="unit-btn" type="button" data-unit="m">M</button>
            <button class="unit-btn" type="button" data-unit="mi">MI</button><button class="unit-btn" type="button" data-unit="km">KM</button>
          </div>
        </div>
      </div>
      <p id="validation" class="validation"></p>
      <div class="keypad" aria-label="Number keypad">
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
        <button class="key utility" data-key=".">.</button><button class="key" data-key="0">0</button><button class="key utility" data-key="back">⌫</button>
      </div>
    </div>
    <div id="result" class="result hidden">
      <div class="result-layout"><div class="answer-stack"><div class="answer-cell"><span class="lab">Official</span><strong id="official"></strong></div><div class="answer-cell"><span class="lab">Your guess</span><strong id="your"></strong></div></div><div class="score-side"><div id="scorePercent" class="score-percent"></div><div id="scoreMult" class="score-mult"></div></div></div>
      <p id="verdict" class="verdict"></p><button id="next" class="btn next" type="button">Next</button>
    </div>
  </div>
</section>
<section id="summary" class="card hidden"><p class="eyebrow">ROUND COMPLETE</p><h2>Your results</h2><p class="summary-line"><strong id="total" class="score"></strong> / 1000</p><button id="restart" class="btn" type="button">Play again</button></section>
</main>

    const display = root.querySelector('#guessDisplay, .guess-display, .display-input');
    if (display) {
      const txt = (display.textContent || '').trim();
      return txt;
    }

    return '';
  }

  function hasSelectedUnit(){
    return !!root.querySelector('.unit-btn.selected, .unit-btn.active, .unit-btn[aria-pressed="true"], input[name="unit"]:checked');
  }

  function updateSubmitState(){
    const btn = getSubmitButton();
    if (!btn) return;

    const value = getGuessValue();
    const validValue = value !== '' && !Number.isNaN(Number(value));
    btn.disabled = !(validValue && hasSelectedUnit());
  }

  // Keep the submit state synced with all possible custom controls.
  root.addEventListener('input', updateSubmitState, true);
  root.addEventListener('change', updateSubmitState, true);
  root.addEventListener('click', function(e){
    if (
      e.target.closest('.unit-btn') ||
      e.target.closest('.key') ||
      e.target.closest('.keypad button') ||
      e.target.closest('[data-key]')
    ){
      setTimeout(updateSubmitState, 0);
    }
  }, true);

  // Prevent accidental submit while disabled even if legacy JS calls click().
  root.addEventListener('click', function(e){
    const btn = e.target.closest('#submitBtn, .submit-btn, button[type="submit"]');
    if (btn && btn.disabled){
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, true);

  // Initialize after existing scripts finish setting up.
  setTimeout(updateSubmitState, 0);
  setTimeout(updateSubmitState, 100);
})();
</script>

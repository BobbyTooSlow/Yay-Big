const questionOverrides={
"MLB pitching distance|Pitcher's plate to rear point of home plate":"How far is it from the pitcher's plate to the rear point of home plate?",
"Soccer penalty mark|Distance from goal line":"How far is the soccer penalty mark from the goal line?",
"Standard railroad gauge|Distance between rails":"How far apart are the rails on standard-gauge railroad track?",
"Olympic athletics track|One lap, lane 1":"How long is one lap of an Olympic athletics track in lane 1?",
"Dartboard bullseye|Height from floor":"How high is the center of a regulation dartboard bullseye?",
"NBA free-throw line|Distance from backboard plane":"How far is the NBA free-throw line from the plane of the backboard?",
"Baseball home plate|Front edge width":"How wide is the front edge of home plate?",
"MLB base|Side length":"How long is one side of an MLB base?",
"Track lane|Standard width":"How wide is a standard athletics track lane?",
"Snooker table|Playing area length":"How long is the playing area of a regulation snooker table?",
"Snooker table|Playing area width":"How wide is the playing area of a regulation snooker table?",
"20-ft ISO shipping container|External length":"How long is the exterior of a 20-foot ISO shipping container?",
"20-ft ISO shipping container|External width":"How wide is the exterior of a 20-foot ISO shipping container?",
"40-ft ISO shipping container|External length":"How long is the exterior of a 40-foot ISO shipping container?",
"40-ft ISO shipping container|External width":"How wide is the exterior of a 40-foot ISO shipping container?",
"Olympic archery target|Face diameter":"What is the diameter of an Olympic archery target face?"
};

function articleFor(s){return /^[aeiou]/i.test(s)?"an":"a"}
function questionText(q){
 const key=`${q.item}|${q.measurement}`; if(questionOverrides[key])return questionOverrides[key];
 const m=q.measurement.toLowerCase(),item=q.item,a=articleFor(item);
 if(["length","external length","playing area length"].includes(m))return `How long is ${a} ${item}?`;
 if(["width","external width","playing area width","standard width","actual width","nominal width"].includes(m))return `How wide is ${a} ${item}?`;
 if(["height","height above floor","height at posts","center height"].includes(m))return `How high is ${a} ${item}?`;
 if(["thickness","actual thickness"].includes(m))return `How thick is ${a} ${item}?`;
 if(["diameter","nominal diameter","face diameter"].includes(m))return `What is the diameter of ${a} ${item}?`;
 if(m==="inside diameter")return `What is the inside diameter of ${a} ${item}?`;
 if(m==="side length")return `How long is one side of ${a} ${item}?`;
 if(m==="depth")return `How deep is ${a} ${item}?`;
 return `What is the ${m} of ${a} ${item}?`;
}
function pick(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function build(){const usable=FULL.filter(x=>x.status!=="Rejected"&&x.value!=null&&x.unit);round=[...pick(usable.filter(x=>x.difficulty==="Easy"),1),...pick(usable.filter(x=>x.difficulty==="Medium"),3),...pick(usable.filter(x=>x.difficulty==="Hard"),1)]}
function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:4})}
function updateGuessDisplay(){const el=$("guessDisplay");if(!guessText){el.textContent="Enter number";el.classList.add("empty")}else{el.textContent=guessText;el.classList.remove("empty")}}
function show(){const q=round[i];$("progress").textContent=`${i+1} / 5`;$("diff").textContent=q.difficulty.toUpperCase();$("question").textContent=questionText(q);guessText="";updateGuessDisplay();$("unit").value="";$("validation").textContent="";$("entry").classList.remove("hidden");$("result").classList.add("hidden")}
document.querySelector(".keypad").addEventListener("click",e=>{const btn=e.target.closest("[data-key]");if(!btn)return;const k=btn.dataset.key;if(k==="back")guessText=guessText.slice(0,-1);else if(k==="."){if(!guessText.includes("."))guessText=guessText?guessText+".":"0."}else{if(guessText.length>=10)return;if(guessText==="0")guessText=k;else guessText+=k}$("validation").textContent="";updateGuessDisplay()});
$("submit").onclick=()=>{const q=round[i],g=Number(guessText),u=$("unit").value;if(!guessText||!Number.isFinite(g)||g<=0){$("validation").textContent="Enter a number greater than zero.";return}if(!u){$("validation").textContent="Choose a unit.";return}
 const officialBase=q.value*factors[q.unit],guessBase=g*factors[u],err=Math.abs(guessBase-officialBase)/officialBase*100,acc=Math.max(0,Math.min(100,Math.round(100-err))),multiplier=mult[q.difficulty],pts=acc*multiplier;total+=pts;
 $("official").textContent=`${fmt(q.value)} ${q.unit}`;
 if(u!==q.unit){$("your").textContent=`${fmt(g)} ${u} = ${fmt(guessBase/factors[q.unit])} ${q.unit}`;}else{$("your").textContent=`${fmt(g)} ${u}`;}
 $("scorePercent").textContent=`${acc}%`;
 $("scoreMult").textContent=`${multiplier}X`;
 $("verdict").textContent=acc===100?"Dead on.":acc>=95?"Excellent.":acc>=90?"Very good.":acc>=80?"Respectable.":"Keep calibrating.";$("entry").classList.add("hidden");$("result").classList.remove("hidden");$("next").textContent=i===4?"See results":"Next";
};
$("next").onclick=()=>{if(++i===5){$("game").classList.add("hidden");$("summary").classList.remove("hidden");$("total").textContent=total}else show()};
$("restart").onclick=()=>{i=0;total=0;build();$("summary").classList.add("hidden");$("game").classList.remove("hidden");show()};
build();show();
</script>
</body>
</html>

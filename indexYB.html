<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yay Big</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #000000;
    --panel: #0a0f14;
    --text: #ffffff;
    --blue: #7dd3fc;
    --muted: #a8b3be;
    --border: #22303b;
    --danger: #ff9a9a;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .app {
    width: min(720px, calc(100% - 20px));
    margin: 0 auto;
    padding: 14px 0 28px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .brand-kicker {
    margin: 0 0 2px;
    color: var(--text);
    font-size: clamp(0.85rem, 3.4vw, 1.05rem);
    font-weight: 500;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    font-size: clamp(2.2rem, 8.5vw, 3.8rem);
    line-height: 0.9;
    letter-spacing: -0.05em;
  }

  h2 {
    margin: 0 0 5px;
    font-size: clamp(1.2rem, 4.3vw, 1.85rem);
    line-height: 1.08;
    letter-spacing: -0.025em;
  }

  .progress {
    color: var(--blue);
    font-weight: 800;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card {
    padding: clamp(14px, 3.5vw, 22px);
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
  }

  .eyebrow {
    margin: 0 0 5px;
    color: var(--blue);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.14em;
  }

  .hint {
    margin: 0 0 12px;
    color: var(--muted);
    line-height: 1.35;
    font-size: 0.9rem;
  }

  .guess-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 118px auto;
    gap: 8px;
    align-items: end;
  }

  .field { display: block; }
  .grow { flex: 1; }
  .unit-field { width: auto; }

  .field span {
    display: block;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
  }

  input, select, button { font: inherit; }

  input, select {
    width: 100%;
    min-height: 44px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #030506;
    color: var(--text);
    font-size: 1rem;
  }

  input::placeholder { color: #65727d; }

  input:focus, select:focus, button:focus-visible {
    outline: 3px solid rgba(125, 211, 252, 0.35);
    outline-offset: 2px;
  }

  .primary {
    min-height: 44px;
    margin-top: 10px;
    padding: 0 18px;
    border: 1px solid var(--blue);
    border-radius: 9px;
    background: var(--blue);
    color: #001018;
    font-weight: 900;
    cursor: pointer;
  }

  .submit-inline {
    margin-top: 0;
    white-space: nowrap;
  }

  .primary:hover { filter: brightness(0.95); }

  .validation {
    min-height: 16px;
    margin: 4px 0 0;
    color: var(--danger);
    font-size: 0.82rem;
  }

  .result {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .result-grid, .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .result-label, .summary-grid span {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .result-grid strong, .summary-grid strong {
    color: var(--text);
    font-size: clamp(1.2rem, 4vw, 1.7rem);
    font-variant-numeric: tabular-nums;
  }

  #scoreValue, #totalScore {
    color: var(--blue);
  }

  .verdict {
    margin: 22px 0 0;
    color: var(--blue);
    font-size: 1.05rem;
    font-weight: 800;
  }

  .summary-grid { margin: 24px 0 8px; }
  .hidden { display: none !important; }

  @media (max-width: 520px) {
    .app {
      width: min(100% - 12px, 720px);
      padding-top: 8px;
    }

    .guess-row {
      grid-template-columns: minmax(0, 1fr) 100px auto;
      gap: 6px;
    }

    .field span {
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .result-grid, .summary-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .result-grid strong, .summary-grid strong {
      font-size: 1rem;
    }

    .primary {
      padding: 0 12px;
      font-size: 0.92rem;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <p class="brand-kicker">I'd say it's about...</p>
      <h1>Yay Big</h1>
    </div>
    <div class="progress" id="progress">1 / 10</div>
  </header>

  <section class="card" id="gameCard">
    <p class="eyebrow">ESTIMATE</p>
    <h2 id="question">Loading question…</h2>
    <p class="hint" id="hint"></p>

    <form id="guessForm">
      <div class="guess-row">
        <label class="field grow">
          <span>Your guess</span>
          <input
            id="guessInput"
            type="number"
            inputmode="decimal"
            step="any"
            min="0"
            autocomplete="off"
            placeholder="7.2"
            required
          >
        </label>

        <label class="field unit-field">
          <span>Unit</span>
          <select id="unitSelect">
            <option value="in">inches</option>
            <option value="ft">feet</option>
            <option value="cm">cm</option>
            <option value="m">meters</option>
            <option value="mm">mm</option>
          </select>
        </label>

        <button class="primary submit-inline" type="submit">Submit</button>
      </div>

      <p id="validation" class="validation" role="alert"></p>
    </form>

    <div id="resultPanel" class="result hidden" aria-live="polite">
      <div class="result-grid">
        <div>
          <span class="result-label">Actual</span>
          <strong id="actualValue"></strong>
        </div>
        <div>
          <span class="result-label">Your guess</span>
          <strong id="guessValue"></strong>
        </div>
        <div>
          <span class="result-label">Error</span>
          <strong id="errorValue"></strong>
        </div>
        <div>
          <span class="result-label">Score</span>
          <strong id="scoreValue"></strong>
        </div>
      </div>

      <p id="verdict" class="verdict"></p>
      <button id="nextButton" class="primary" type="button">Next question</button>
    </div>
  </section>

  <section id="summaryCard" class="card hidden">
    <p class="eyebrow">ROUND COMPLETE</p>
    <h2>Your results</h2>

    <div class="summary-grid">
      <div>
        <span>Total score</span>
        <strong id="totalScore"></strong>
      </div>
      <div>
        <span>Best item</span>
        <strong id="bestGuess"></strong>
      </div>
    </div>

    <button id="restartButton" class="primary" type="button">Play again</button>
  </section>
</main>

<script>
const questions = [
  {
    question: "How long is a U.S. dollar bill?",
    answerInches: 6.14,
    displayAnswer: "6.14 in",
    hint: "Use the bill itself — not a stack of bills."
  },
  {
    question: "How wide is a sheet of U.S. letter paper?",
    answerInches: 8.5,
    displayAnswer: "8.5 in",
    hint: "The shorter side."
  },
  {
    question: "How tall is a regulation basketball hoop?",
    answerInches: 120,
    displayAnswer: "10 ft",
    hint: "Floor to rim."
  },
  {
    question: "How long is an NBA basketball court?",
    answerInches: 1128,
    displayAnswer: "94 ft",
    hint: "Baseline to baseline."
  },
  {
    question: "How tall is a standard bowling pin?",
    answerInches: 15,
    displayAnswer: "15 in",
    hint: "Base to tip."
  },
  {
    question: "How long is a standard credit card?",
    answerInches: 3.3701,
    displayAnswer: "3.370 in",
    hint: "The longer side."
  },
  {
    question: "How wide is a standard credit card?",
    answerInches: 2.125,
    displayAnswer: "2.125 in",
    hint: "The shorter side."
  },
  {
    question: "How tall is an official table-tennis net?",
    answerInches: 6,
    displayAnswer: "6 in",
    hint: "Table surface to top of net."
  },
  {
    question: "How long is an Olympic swimming pool?",
    answerInches: 1968.5039,
    displayAnswer: "50 m",
    hint: "The long-course standard."
  },
  {
    question: "How high is a regulation volleyball net for men's competition?",
    answerInches: 95.6693,
    displayAnswer: "2.43 m",
    hint: "Floor to top of net."
  }
];

const unitToInches = {
  in: 1,
  ft: 12,
  cm: 1 / 2.54,
  m: 100 / 2.54,
  mm: 1 / 25.4
};

let index = 0;
let results = [];

const $ = (id) => document.getElementById(id);

const gameCard = $("gameCard");
const summaryCard = $("summaryCard");
const progress = $("progress");
const questionEl = $("question");
const hintEl = $("hint");
const guessForm = $("guessForm");
const guessInput = $("guessInput");
const unitSelect = $("unitSelect");
const validation = $("validation");
const resultPanel = $("resultPanel");
const actualValue = $("actualValue");
const guessValue = $("guessValue");
const errorValue = $("errorValue");
const scoreValue = $("scoreValue");
const verdict = $("verdict");
const nextButton = $("nextButton");
const restartButton = $("restartButton");
const totalScore = $("totalScore");
const bestGuess = $("bestGuess");

function formatNumber(value, maxDigits = 4) {
  return value.toLocaleString(undefined, {
    maximumFractionDigits: maxDigits
  });
}

function scoreForError(percentError) {
  return Math.max(0, Math.min(100, Math.round(100 - percentError)));
}

function verdictForScore(score) {
  if (score === 100) return "Dead on.";
  if (score >= 99) return "Extremely close.";
  if (score >= 95) return "Excellent.";
  if (score >= 90) return "Very good.";
  if (score >= 80) return "Respectable.";
  return "Plenty of room to improve.";
}

function showQuestion() {
  const q = questions[index];

  progress.textContent = `${index + 1} / ${questions.length}`;
  questionEl.textContent = q.question;
  hintEl.textContent = q.hint;

  guessInput.value = "";
  validation.textContent = "";
  resultPanel.classList.add("hidden");
  guessForm.classList.remove("hidden");
  guessInput.focus();
}

guessForm.addEventListener("submit", (event) => {
  event.preventDefault();

  const rawGuess = Number(guessInput.value);
  const unit = unitSelect.value;

  if (!Number.isFinite(rawGuess) || rawGuess <= 0) {
    validation.textContent = "Enter a number greater than zero.";
    return;
  }

  const q = questions[index];
  const guessInches = rawGuess * unitToInches[unit];

  const percentError =
    Math.abs(guessInches - q.answerInches) / q.answerInches * 100;

  const score = scoreForError(percentError);

  results.push({
    percentError,
    score
  });

  actualValue.textContent = q.displayAnswer;
  guessValue.textContent = `${formatNumber(rawGuess)} ${unit}`;
  errorValue.textContent = `${Math.round(percentError)}%`;
  scoreValue.textContent = `${score}%`;
  verdict.textContent = verdictForScore(score);

  guessForm.classList.add("hidden");
  resultPanel.classList.remove("hidden");

  nextButton.textContent =
    index === questions.length - 1 ? "See results" : "Next question";
});

nextButton.addEventListener("click", () => {
  index += 1;

  if (index >= questions.length) {
    showSummary();
    return;
  }

  showQuestion();
});

function showSummary() {
  const total = results.reduce((sum, item) => sum + item.score, 0);
  const best = Math.max(...results.map((item) => item.score));

  gameCard.classList.add("hidden");
  summaryCard.classList.remove("hidden");

  totalScore.textContent = `${total} / ${questions.length * 100}`;
  bestGuess.textContent = `${best}%`;
}

restartButton.addEventListener("click", () => {
  index = 0;
  results = [];

  summaryCard.classList.add("hidden");
  gameCard.classList.remove("hidden");

  showQuestion();
});

showQuestion();
</script>
</body>
</html>

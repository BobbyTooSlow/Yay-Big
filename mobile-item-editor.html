<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yay Big Mobile Item Editor</title>
<style>
:root{--bg:#000;--panel:#0a0f14;--panel2:#101820;--text:#fff;--blue:#7dd3fc;--muted:#9aa8b5;--border:#26343f;--red:#ff8f8f;--yellow:#fff2a8;--green:#9be7b1;--orange:#ffc56f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100dvh}
button,input,select,textarea{font:inherit}button{touch-action:manipulation}
.app{width:min(680px,100%);height:100dvh;margin:auto;padding:calc(7px + env(safe-area-inset-top)) 9px calc(78px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:7px;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.brand h1{margin:0;color:var(--blue);font-size:1.32rem;line-height:1}.brand p{margin:0;color:var(--muted);font-size:.72rem}
.header-actions{display:flex;gap:6px}.btn{min-height:34px;border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#001018;font-weight:850;padding:5px 9px;cursor:pointer;font-size:.78rem}.btn.secondary{background:transparent;color:var(--blue)}.btn.muted{border-color:var(--border);background:var(--panel2);color:var(--text)}
.status{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:5px 8px;color:var(--muted);font-size:.68rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status strong{color:var(--green)}
.queuebar{display:grid;grid-template-columns:1fr;gap:6px}.queuebar select{height:35px}
input,select,textarea{width:100%;font-size:16px;color:#fff;background:#05080a;border:1px solid var(--border);border-radius:9px;padding:7px 9px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.card{min-height:0;border:1px solid var(--border);background:var(--panel);border-radius:15px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.cardtop{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid var(--border);background:var(--panel2)}
.id{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:900;letter-spacing:.02em;font-size:.86rem}.position{color:var(--muted);font-size:.7rem;text-align:center}.navbtn{min-height:30px;min-width:42px;padding:3px 7px;font-size:.72rem}.navbtn:disabled{opacity:.35;cursor:default}
.form{min-height:0;padding:8px;display:grid;grid-template-rows:auto minmax(58px,1fr) auto auto auto;gap:7px;overflow:hidden}.field{display:grid;gap:3px;min-width:0}.field label{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850}
textarea{resize:none;line-height:1.22;min-height:0}.question{height:100%;color:var(--yellow);font-weight:750}.grid3{display:grid;grid-template-columns:1.15fr .85fr 1fr;gap:7px}.meta{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}.pill{white-space:nowrap;font-size:.62rem;border:1px solid var(--border);padding:3px 6px;border-radius:999px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.pill.review{color:var(--orange)}.pill.keep{color:var(--green)}.pill.bad{color:var(--red)}
.empty{display:block;padding:24px 14px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--green);font-size:1rem;margin-bottom:4px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.97);border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.bottom-inner{width:min(680px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.decision{min-height:54px;border-radius:12px;font-size:.84rem;font-weight:950;cursor:pointer}.keepbtn{border:1px solid #4d8c61;background:#173522;color:#bdf4ca}.notusbtn{border:1px solid #8b6f32;background:#352b14;color:#ffe4a2}.badbtn{border:1px solid #713737;background:#351717;color:#ffb2b2}
.hidden{display:none!important}.fileinput{display:none}
@media(max-height:720px){.app{padding-top:calc(4px + env(safe-area-inset-top));gap:5px}.header{min-height:32px}.brand p{display:none}.status{padding:4px 7px}.queuebar select{height:32px}.cardtop{padding:5px 7px}.form{padding:6px;gap:5px;grid-template-rows:auto minmax(48px,1fr) auto auto auto}.decision{min-height:48px}.bottom{padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom))}}
@media(max-width:380px){.brand p{display:none}.header-actions .btn{padding:5px 7px}.grid3{grid-template-columns:1fr .72fr .95fr}.decision{font-size:.76rem}}
</style>
</head>
<body>
<main class="app">
  <div class="header">
    <div class="brand"><h1>YAY BIG</h1><p>Mobile Item Editor</p></div>
    <div class="header-actions">
      <button id="exportBtn" class="btn">Export</button>
      <button id="importBtn" class="btn secondary">Import</button>
      <input id="importFile" class="fileinput" type="file" accept=".json,application/json">
    </div>
  </div>

  <div id="workspaceStatus" class="status">Loading item database…</div>

  <div class="queuebar">
    <select id="queueFilter" aria-label="Item queue">
      <option value="Review" selected>Review queue</option>
      <option value="Keep">Keep items</option>
      <option value="NotUS">Not US items</option>
      <option value="BadItem">Bad Items</option>
      <option value="All">All items</option>
    </select>
  </div>

  <section id="editorCard" class="card hidden">
    <div class="cardtop">
      <div id="itemId" class="id">yb-00000</div>
      <div id="position" class="position">0 of 0</div>
      <button id="prevBtn" class="btn muted navbtn" aria-label="Previous item">← Prev</button>
      <button id="nextBtn" class="btn muted navbtn" aria-label="Next item">Next →</button>
    </div>
    <div class="form">
      <div class="field"><label for="item">Item</label><input id="item"></div>
      <div class="field"><label for="question">Question</label><textarea id="question" class="question"></textarea></div>
      <div class="grid3">
        <div class="field"><label for="value">Value</label><input id="value" type="number" step="any" inputmode="decimal"></div>
        <div class="field"><label for="unit">Unit</label><select id="unit"><option value="">—</option><option>mm</option><option>cm</option><option>m</option><option>km</option><option>in</option><option>ft</option><option>yd</option><option>mi</option><option>mil</option></select></div>
        <div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
      </div>
      <div class="field"><label for="regionTags">Region tags</label><input id="regionTags" placeholder="USCanada, Global, Unassigned"></div>
      <div id="meta" class="meta"></div>
    </div>
  </section>

  <div id="emptyState" class="card empty hidden"><strong>Queue complete.</strong>No Items match this view.</div>
</main>

<div class="bottom">
  <div class="bottom-inner">
    <button id="keepBtn" class="decision keepbtn">KEEP</button>
    <button id="notUsBtn" class="decision notusbtn">NOT US</button>
    <button id="badBtn" class="decision badbtn">BAD ITEM</button>
  </div>
</div>

<script>
const STORAGE_KEY="yayBigItemWorkspaceV3";
const $=id=>document.getElementById(id);
let items=[];
let queue=[];
let queueIndex=0;
let currentId=null;

function stableId(n){return `yb-${String(n).padStart(5,"0")}`}
function canonicalItemId(id){const m=String(id??"").match(/^yb-(\d+)$/i);return m?`yb-${String(parseInt(m[1],10)).padStart(5,"0")}`:String(id??"")}
function normalizeItem(x){
  let id=canonicalItemId(x.id);
  if(!/^yb-\d{5,}$/.test(id)) id=stableId(nextNumericId());
  return {
    id,
    item:String(x.item??""), question:String(x.question??""), measurement:String(x.measurement??""),
    value:(x.value===""||x.value==null)?null:Number(x.value), unit:String(x.unit??""),
    difficulty:["Easy","Medium","Hard"].includes(x.difficulty)?x.difficulty:"Medium",
    status:["Keep","Review","BadItem"].includes(x.status)?x.status:(x.status==="Approved"?"Keep":"Review"),
    regionTags:Array.isArray(x.regionTags)?[...x.regionTags]:["USCanada"], source:String(x.source??"")
  };
}
function nextNumericId(){return Math.max(0,...items.map(x=>Number(String(x.id||"").replace(/\D/g,""))||0))+1}
function payload(){return {schemaVersion:2,database:"Yay Big Items",items}}
function save(msg="Edits saved in this browser."){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(payload()));
  setStatus(msg);
}
function setStatus(msg){$("workspaceStatus").innerHTML=`<strong>Workspace:</strong> ${escapeHtml(msg)}`}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function isNotUS(x){return x.status==="Keep" && Array.isArray(x.regionTags) && !x.regionTags.includes("USCanada") && !x.regionTags.includes("Global")}
function matchesFilter(x,f){if(f==="All")return true;if(f==="NotUS")return isNotUS(x);return x.status===f}
function getCurrent(){return items.find(x=>x.id===currentId)||null}
function rebuildQueue(preferId=currentId){
  const f=$("queueFilter").value;
  queue=items.filter(x=>matchesFilter(x,f));
  let idx=queue.findIndex(x=>x.id===preferId);
  if(idx<0) idx=Math.min(queueIndex,Math.max(0,queue.length-1));
  queueIndex=idx<0?0:idx;
  currentId=queue.length?queue[queueIndex].id:null;
  render();
}
function render(){
  const x=getCurrent();
  const has=!!x;
  $("editorCard").classList.toggle("hidden",!has);
  $("emptyState").classList.toggle("hidden",has);
  $("prevBtn").disabled=!has||queueIndex<=0;
  $("nextBtn").disabled=!has||queueIndex>=queue.length-1;
  $("keepBtn").disabled=!has;$("notUsBtn").disabled=!has;$("badBtn").disabled=!has;
  if(!has)return;
  $("itemId").textContent=x.id;
  $("position").textContent=`${queueIndex+1} of ${queue.length}`;
  $("item").value=x.item;$("question").value=x.question;
  $("value").value=x.value==null?"":x.value;$("unit").value=x.unit;$("difficulty").value=x.difficulty;
  $("regionTags").value=(x.regionTags||[]).join(", ");
  const statusClass=x.status==="Review"?"review":x.status==="BadItem"?"bad":"keep";
  const playable=x.status==="Keep"&&(x.regionTags.includes("USCanada")||x.regionTags.includes("Global"));
  $("meta").innerHTML=`<span class="pill ${statusClass}">${escapeHtml(x.status)}</span><span class="pill">${playable?"US/Canada playable":isNotUS(x)?"Not US / Unassigned":"Not playable"}</span>`;
}
function writeField(key,value){const x=getCurrent();if(!x)return;x[key]=value;save()}
function parseTags(raw){return [...new Set(String(raw).split(",").map(s=>s.trim()).filter(Boolean))]}
function classify(kind){
  const x=getCurrent();if(!x)return;
  const oldQueue=[...queue];
  const oldIndex=queueIndex;
  const nextId=oldQueue[oldIndex+1]?.id||null;

  if(kind==="Keep"){
    x.status="Keep";
    if(!x.regionTags.includes("USCanada")&&!x.regionTags.includes("Global")) x.regionTags=x.regionTags.filter(t=>t!=="Unassigned").concat("USCanada");
  }else if(kind==="NotUS"){
    x.status="Keep";
    x.regionTags=x.regionTags.filter(t=>t!=="USCanada");
    if(!x.regionTags.length) x.regionTags=["Unassigned"];
  }else{
    x.status="BadItem";x.regionTags=[];
  }
  save(`${x.id} classified as ${kind==="BadItem"?"Bad Item":kind}.`);

  // Every classification advances. Prefer the item that was next in the visible queue.
  const f=$("queueFilter").value;
  queue=items.filter(item=>matchesFilter(item,f));
  if(!queue.length){currentId=null;queueIndex=0;render();return}

  let idx=nextId?queue.findIndex(item=>item.id===nextId):-1;
  if(idx<0){
    // If the next item dropped out of this filter, use the same slot, which is now the next surviving item.
    idx=Math.min(oldIndex,queue.length-1);
    // If we classified the last item in a queue that still contains it, do not jump backward.
    if(oldIndex>=oldQueue.length-1 && queue[idx]?.id===x.id){currentId=null;queueIndex=0;render();return}
  }
  queueIndex=idx;
  currentId=queue[idx].id;
  render();
}
function exportDb(){
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="items.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importDb(file){
  try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.items))throw new Error("Not a Yay Big Items database");items=data.items.map(normalizeItem);save(`Imported ${items.length} Items.`);queueIndex=0;currentId=null;rebuildQueue(null)}catch(e){alert(`Import failed: ${e.message}`)}
}
async function loadInitial(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const data=JSON.parse(raw);if(data&&Array.isArray(data.items)){items=data.items.map(normalizeItem);setStatus(`Loaded saved workspace with ${items.length} Items.`);rebuildQueue(null);return}}
  }catch(e){console.warn(e)}
  try{
    const res=await fetch(`items.json?v=${Date.now()}`,{cache:"no-store"});if(!res.ok)throw new Error(`items.json returned ${res.status}`);
    const data=await res.json();if(!data||!Array.isArray(data.items))throw new Error("Invalid items.json");items=data.items.map(normalizeItem);save(`Loaded published database with ${items.length} Items.`);rebuildQueue(null);
  }catch(e){setStatus("Could not load items.json automatically. Tap Import and choose your latest items.json file.");rebuildQueue(null)}
}

["item","question"].forEach(id=>$(id).addEventListener("input",()=>writeField(id,$(id).value)));
$("value").addEventListener("input",()=>writeField("value",$("value").value===""?null:Number($("value").value)));
$("unit").addEventListener("change",()=>writeField("unit",$("unit").value));
$("difficulty").addEventListener("change",()=>writeField("difficulty",$("difficulty").value));
$("regionTags").addEventListener("change",()=>{writeField("regionTags",parseTags($("regionTags").value));render()});
$("queueFilter").addEventListener("change",()=>{queueIndex=0;currentId=null;rebuildQueue(null)});
$("prevBtn").addEventListener("click",()=>{if(queueIndex>0){queueIndex--;currentId=queue[queueIndex].id;render()}});
$("nextBtn").addEventListener("click",()=>{if(queueIndex<queue.length-1){queueIndex++;currentId=queue[queueIndex].id;render()}});
$("keepBtn").addEventListener("click",()=>classify("Keep"));
$("notUsBtn").addEventListener("click",()=>classify("NotUS"));
$("badBtn").addEventListener("click",()=>classify("BadItem"));
$("exportBtn").addEventListener("click",exportDb);
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",()=>{const f=$("importFile").files[0];if(f)importDb(f);$("importFile").value=""});
loadInitial();
</script>
</body>
</html>
